name: Dashboard browser checks
on:
  push:
    branches: [main]
    paths-ignore:
      - quotes.json
      - version.json
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Test application behavior and approved visuals
        run: npx playwright test tests/dashboard.spec.cjs tests/release-visual.spec.cjs --reporter=line
      - name: Upload visual evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-evidence
          path: test-results/
          retention-days: 30
  visual-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Capture candidate baselines without committing them
        run: npx playwright test tests/release-visual.spec.cjs --update-snapshots --reporter=line
      - name: Upload visual candidates for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-candidates
          path: |
            tests/*-snapshots/
            test-results/
          retention-days: 30
